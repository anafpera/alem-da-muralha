    <header>

<nav>

    <main>

        <section class="introducao-contatos">
            <h2>Vamos conversar?</h2>

            <p>
                Tem alguma dúvida, sugestão ou deseja compartilhar
                sua experiência sobre a China? Será um prazer receber
                sua mensagem!
            </p>
        </section>

        <section class="formulario-contato">

            <form>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome"
                    placeholder="Digite seu nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"
                    placeholder="Digite seu e-mail">

                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto"
                    placeholder="Sobre o que deseja falar?">

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem"
                    rows="6" placeholder="Escreva sua mensagem..."></textarea>

                <button type="submit">Enviar mensagem</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Além da Muralha - 2026</p>
    </footer>
